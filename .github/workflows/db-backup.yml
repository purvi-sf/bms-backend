name: Database Backup

on:
  schedule:
    - cron: '0 0 * * 0'  
  workflow_dispatch:       

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify SQL files exist
        run: |
          echo "Checking backup files..."
          ls -la database/
          echo "Schema file size: $(wc -l < database/01_schema.sql) lines"
          echo "Seed file size: $(wc -l < database/02_seed.sql) lines"
          echo "Query file size: $(wc -l < database/03_queries.sql) lines"

      - name: Validate SQL syntax
        run: |
          echo "SQL backup files are version controlled in Git"
          echo "Schema: database/01_schema.sql"
          echo "Seed: database/02_seed.sql"
          echo "Queries: database/03_queries.sql"
          echo "Backup strategy: SQL scripts committed to GitHub"
          echo "Restore: psql -d bms -f database/01_schema.sql"